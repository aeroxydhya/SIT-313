<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribe to DEV@Deakin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Subscribe to DEV@Deakin</h1>
    <p>Get the latest updates and news directly to your inbox!</p>
    <form id="subscribeForm">
      <input type="email" id="userEmail" placeholder="Enter your email" required>
      <button type="submit">Join Now</button>
    </form>
  </div>

  <script>
    document.getElementById('subscribeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('userEmail').value;

      try {
        const res = await fetch('/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        alert(data.message || data.error || 'Unexpected response');
      } catch (error) {
        console.error(error);
        alert('Failed to subscribe. Try again later.');
      }
    });
  </script>
</body>
</html>
